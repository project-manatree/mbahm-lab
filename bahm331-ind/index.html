<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24-Hour Retreat Care Operations</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1220;
    }
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #iso-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .simple-switcher {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      gap: 6px;
      padding: 5px;
      background: rgba(9, 13, 22, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .simple-switcher .mode-btn {
      padding: 7px 22px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="simple-switcher">
    <button id="btn-mode-unfiltered" class="mode-btn active-current" onclick="SimApp.setMode('unfiltered')">
      Before
    </button>
    <button id="btn-mode-tiered" class="mode-btn" onclick="SimApp.setMode('tiered')">
      After
    </button>
  </div>

  <main class="viewport" id="viewport">
    <canvas id="iso-canvas"></canvas>
  </main>

  <script src="../engine/ph-engine.js"></script>
  <script src="../engine/ph-sprites.js"></script>
  <script src="./renderer.js"></script>
  <script src="./simulation.js"></script>
</body>
</html>
