<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital to Retreat Concierge Transfer</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1220;
    }
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #iso-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .simple-switcher {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      background: rgba(9, 13, 22, 0.90);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .simple-switcher .mode-btn {
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.80rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .cmp-strip {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
      padding: 0 6px;
      white-space: nowrap;
    }
    .cmp-strip b {
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="simple-switcher">
    <button id="btn-mode-current" class="mode-btn active-current" onclick="SimApp.setMode('current')">
      Current
    </button>
    <button id="btn-mode-future" class="mode-btn" onclick="SimApp.setMode('future')">
      Target
    </button>
    <span class="cmp-strip">Current State (275m) → <b>Future State (110m)</b></span>
  </div>

  <main class="viewport" id="viewport">
    <canvas id="iso-canvas"></canvas>
  </main>

  <script src="../engine/ph-engine.js"></script>
  <script src="../engine/ph-sprites.js"></script>
  <script src="./renderer.js"></script>
  <script src="./simulation.js"></script>
</body>
</html>
