<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAHM 330 Assignment 1 — Hospital-to-Retreat Concierge Transfer Pathway</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1220;
    }
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #iso-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .simple-switcher {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 14px 7px;
      max-width: 96vw;
      background: rgba(9, 13, 22, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .simple-title {
      font-size: 0.70rem;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 92vw;
    }
    .simple-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .simple-switcher .mode-btn {
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.80rem;
      font-weight: 700;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(30, 41, 59, 0.85);
      color: #94a3b8;
      box-shadow: none;
      cursor: pointer;
      transition: all 0.18s;
    }
    .simple-switcher .mode-btn:hover {
      color: #e2e8f0;
    }
    .simple-switcher .mode-btn.active-current {
      background: #ef4444;
      border-color: #fca5a5;
      color: #ffffff;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.35), 0 0 14px rgba(239, 68, 68, 0.55);
    }
    .simple-switcher .mode-btn.active-future {
      background: #10b981;
      border-color: #6ee7b7;
      color: #ffffff;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.35), 0 0 14px rgba(16, 185, 129, 0.55);
    }
    .cmp-strip {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0 8px;
      white-space: nowrap;
    }
    .cmp-strip.cur-state {
      color: #fca5a5;
    }
    .cmp-strip.fut-state {
      color: #6ee7b7;
    }
  </style>
</head>
<body>
  <div class="simple-switcher">
    <div class="simple-title">BAHM 330 Assignment 1 — Hospital-to-Retreat Concierge Transfer Pathway</div>
    <div class="simple-row">
      <button id="btn-mode-current" class="mode-btn active-current" onclick="SimApp.setMode('current')">
        Current
      </button>
      <button id="btn-mode-future" class="mode-btn" onclick="SimApp.setMode('future')">
        Target
      </button>
      <span id="state-time-strip" class="cmp-strip cur-state">Current: 275m Cycle · 180m Wait · 98% Ward Occ. · No Retreat / No Van</span>
    </div>
  </div>

  <main class="viewport" id="viewport">
    <canvas id="iso-canvas"></canvas>
  </main>

  <script src="../engine/ph-engine.js"></script>
  <script src="../engine/ph-sprites.js"></script>
  <script src="./renderer.js"></script>
  <script src="./simulation.js"></script>
</body>
</html>
