<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital to Retreat Concierge Transfer</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1220;
    }
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #iso-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .simple-switcher {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: rgba(9, 13, 22, 0.90);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .simple-switcher .mode-btn {
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .clock-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .spd-btn {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(30, 41, 59, 0.8);
      color: #cbd5e1;
      cursor: pointer;
    }
    .spd-btn.active {
      background: #0ea5e9;
      color: #090d16;
      border-color: #38bdf8;
    }
    .cmp-strip {
      font-size: 0.72rem;
      font-weight: 600;
      color: #94a3b8;
      padding: 0 6px;
      white-space: nowrap;
    }
    .cmp-strip b {
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="simple-switcher">
    <button id="btn-mode-current" class="mode-btn active-current" onclick="SimApp.setMode('current')">
      Current (Waiting Queues)
    </button>
    <button id="btn-mode-future" class="mode-btn" onclick="SimApp.setMode('future')">
      Target (Smooth Flow)
    </button>
    <div class="clock-pill">
      <span>🕒</span>
      <span id="sim-clock">08:00</span>
    </div>
    <button id="spd-1" class="spd-btn active" onclick="SimApp.setSpeed(1)">1x</button>
    <button id="spd-2" class="spd-btn" onclick="SimApp.setSpeed(2)">2x</button>
    <button id="spd-5" class="spd-btn" onclick="SimApp.setSpeed(5)">5x</button>
    <span class="cmp-strip">Current State (275m) → <b>Future State (110m)</b></span>
  </div>

  <main class="viewport" id="viewport">
    <canvas id="iso-canvas"></canvas>
  </main>

  <script src="../engine/ph-engine.js"></script>
  <script src="../engine/ph-sprites.js"></script>
  <script src="./renderer.js"></script>
  <script src="./simulation.js"></script>
</body>
</html>
